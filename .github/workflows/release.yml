name: Release

# When you push a version tag (for example v1.0.0), this workflow makes a
# GitHub release with one .zip file per skill. People who use Claude or
# ChatGPT on the web upload these files by hand.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build one zip per skill
        run: bash scripts/build-zips.sh dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --title "$TAG" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md) for the changes in this version."
